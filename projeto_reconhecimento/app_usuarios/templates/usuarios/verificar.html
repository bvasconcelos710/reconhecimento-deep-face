{% extends 'base.html' %}
{% block title %}Verificação de Usuário{% endblock %}

{% block content %}
<div class="container">
  <h2>Verificação de Usuário</h2>

  <!-- Vídeo da webcam -->
  <div>
    <video id="video" width="320" height="240" autoplay></video>
    <br>
    <button type="button" onclick="tirarFoto()">Tirar Foto</button>
  </div>
  <!-- Canvas invisível e preview -->
  <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
  <br>
  <img id="foto-preview" src="" alt="Foto capturada" style="display:none;" />
  <br><br>

  <!-- Formulário -->
  <form id="form-verificacao" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" id="input-foto" name="foto" style="display:none;" />
    <button type="submit">Verificar</button>
  </form>
</div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const inputFoto = document.getElementById('input-foto');
  const imgPreview = document.getElementById('foto-preview');

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      video.srcObject = stream;
    })
    .catch(err => {
      console.error("Erro ao acessar a câmera: ", err);
    });

  function tirarFoto() {
    const contexto = canvas.getContext('2d');
    contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      const file = new File([blob], "foto_webcam.jpg", { type: "image/jpeg" });
      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      inputFoto.files = dataTransfer.files;

      imgPreview.src = URL.createObjectURL(blob);
      imgPreview.style.display = 'block';
    }, 'image/jpeg');
  }

  document.getElementById('form-verificacao').addEventListener('submit', function (event) {
    if (inputFoto.files.length === 0) {
      alert("Por favor, tire uma foto antes de verificar.");
      event.preventDefault(); // Impede o envio do formulário
    }
  });

</script>
{% endblock %}
