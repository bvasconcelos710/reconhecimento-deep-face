{% extends 'base.html' %}

{% block title %}Resetar Senha{% endblock %}

{% block content %}
<div class="container col-md-4">
    <h2>Resetar Senha</h2>
    <p> Informe seu e-mail para receber as instruções de como resetar a senha</p>
    <form method="post">
        {% csrf_token %}
        <div class="mt-3">
            <label class="form-label" for="id_email">Email:</label>
            <input type="email" name="email" class="form-control" id="id_email">
        </div>
        <button class="mt-3" type="submit">Resetar</button>
    </form>
</div>
{% endblock %}
