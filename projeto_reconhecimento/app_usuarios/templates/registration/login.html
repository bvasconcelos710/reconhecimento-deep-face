{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-3 mb-3">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <a class="mt-3" href="{% url 'password_reset' %}">Esqueci minha senha</a>
</div>
{% endblock %}
