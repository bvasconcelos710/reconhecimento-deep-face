{% extends 'base.html' %}
{% block title %}Início{% endblock %}

{% block content %}
<div class="container text-center my-5">
    <h1>
        <i class="bi bi-person-bounding-box "></i>
    </h1>
    <h2 class="mb-3">Bem-vindo ao JusFacial</h2>
    <p class="lead">Utilize o menu abaixo para navegar entre as funções disponíveis:</p>

    <div class="row justify-content-center mt-4">
        <div class="col-md-4 col-sm-6 mb-3">
            <a href="{% url 'cadastrar_usuario' %}"
                class="btn btn-custom  btn-lg w-100 shadow-sm d-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-person-plus-fill fs-3"></i>
                <div>
                    Cadastrar Novo Apenado
                </div>
            </a>
        </div>
        <div class="col-md-4 col-sm-6 mb-3">
            <a href="{% url 'validar_presenca' %}"
                class="btn btn-custom  btn-lg w-100 shadow-sm d-flex justify-content-center align-items-center gap-4">
                <i class="bi bi-camera-fill fs-3"></i>
                <div>Verificar
                    <br>
                    Presença
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
